name: React quote task manual total

on:
  push:
    branches:
      - main
      - feature/react-quote-manual-task-total
    paths:
      - "scripts/react/**"
      - ".github/workflows/react_quote_manual_total.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-react:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Invoice Ninja fork
        uses: actions/checkout@v4

      - name: Checkout compatible Invoice Ninja React sources
        uses: actions/checkout@v4
        with:
          repository: invoiceninja/ui
          ref: 34098c42ebc6acbcae3b35b314067d0429a51600
          path: ui
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Modify React source and generate real git patch
        run: |
          set -euo pipefail
          node --check scripts/react/apply-manual-quote-total.mjs
          node scripts/react/apply-manual-quote-total.mjs ui
          mkdir -p artifacts
          git -C ui diff --check
          git -C ui diff --binary > artifacts/react-quote-manual-total.patch
          test -s artifacts/react-quote-manual-total.patch
          git -C ui status --short

      - name: Build React using Laravel fork configuration
        working-directory: ui
        env:
          VITE_IS_TEST: "false"
          VITE_IS_HOSTED: "false"
          VITE_API_URL: ""
          VITE_PUSHER_APP_KEY: ""
        run: |
          set -euo pipefail
          cp ../vite.config.ts.react ./vite.config.js
          cp .env.example .env
          sed -i 's/^VITE_IS_TEST=.*/VITE_IS_TEST=false/' .env
          npm ci
          npm run build

      - name: Check bundle output and package
        run: |
          set -euo pipefail
          test -s ui/dist/index.html
          test -n "$(find ui/dist -maxdepth 2 -type f -name '*.js' -print -quit)"
          tar -czf artifacts/react-quote-manual-total-dist.tar.gz -C ui/dist .
          sha256sum artifacts/*.patch artifacts/*.tar.gz > artifacts/SHA256SUMS

      - name: Upload release candidate assets
        uses: actions/upload-artifact@v4
        with:
          name: invoice-ninja-react-quote-manual-total
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
